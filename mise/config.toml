# MISEの設定ファイル

# 言語やツールのバージョン指定
[tools]
node = "lts"
npm = "latest"
python = "3.12"
rust = "stable"
uv = "latest"

# タスク定義
[tasks."typst:setup"]
description = "Typst環境のセットアップ"
run = """
mkdir -p .typst
ln -sf ~/dotfiles/typst/.typst/template.typ .typst/template.typ
cp -n ~/dotfiles/typst/report.typ ./report.typ
cp -n ~/dotfiles/typst/sample_tables.typ ./sample_tables.typ
"""

[tasks."typst:sync"]
description = "Typstテンプレートのシンボリックリンクを再同期"
run = "ln -sf ~/dotfiles/typst/.typst/template.typ .typst/template.typ"

# ↓削除検討↓
[tasks.copy-fonts]
description = "フォントをカレントにコピー"
run = "cp -r ~/dotfiles/fonts ."

[tasks.copy-typst-template]
description = "Typstレポートテンプレートをカレントディレクトリにコピー"
# ghqコマンドを使って動的にパスを解決する堅牢な設計に変更
run = "cp $(ghq root)/github.com/Vigener/win-env/Typst/report_template.typ ."

[tasks.new-typst-report]
description = "新しいTypstレポートを作成（使い方: mise run new-typst-report -- myreport.typ）"
run = '''
#!/bin/bash
FILENAME="${1:-report.typ}"
TEMPLATE_PATH="$(ghq root)/github.com/Vigener/win-env/Typst/report_template.typ"

# テンプレートが存在するかどうかのフェイルセーフを追加
if [ ! -f "$TEMPLATE_PATH" ]; then
    echo "エラー: テンプレートが見つかりません。ghq get でリポジトリをCloneしていますか？"
    echo "パス: $TEMPLATE_PATH"
    exit 1
fi

cp "$TEMPLATE_PATH" "$FILENAME"
echo "✓ $FILENAME を作成しました"
ls -lh "$FILENAME"
'''

[tasks.reload-karabiner]
description = "Karabiner設定を再生成して反映（dotfiles/karabiner で npm run build を実行）"
run = '''
#!/bin/bash
set -euo pipefail

DOTFILES_DIR="$(ghq root)/github.com/Vigener/dotfiles"
KARABINER_DIR="$DOTFILES_DIR/karabiner"

if [ ! -d "$KARABINER_DIR" ]; then
    echo "エラー: karabiner ディレクトリが見つかりません"
    echo "パス: $KARABINER_DIR"
    exit 1
fi

cd "$KARABINER_DIR"
npm run build

echo "✓ Karabiner設定を再生成しました"
echo "  出力先: ~/.config/karabiner/karabiner.json"
'''

[tasks.init-typst]
description = "Initialize Typst report scaffold from report.md only when report.typ does not exist"
run = """
#!/usr/bin/env bash
set -euo pipefail

if [[ -f report.typ ]]; then
	echo "ℹ️ report.typ already exists. Skip conversion to avoid overwriting manual edits."
	exit 0
fi

if [[ ! -f report.md ]]; then
	echo "❌ report.md not found. Nothing to convert." >&2
	exit 1
fi

if ! command -v pandoc >/dev/null 2>&1; then
	echo "❌ pandoc is required for init-typst. Install pandoc and retry." >&2
	exit 1
fi

mkdir -p .typst

if ! command -v ghq >/dev/null 2>&1; then
	echo "❌ ghq is required to locate template source. Install ghq or copy template manually." >&2
	exit 1
fi

template_src="$(ghq root)/github.com/Vigener/dotfiles/typst/template.typ"
if [[ ! -f "$template_src" ]]; then
	echo "❌ template source not found: $template_src" >&2
	exit 1
fi
cp "$template_src" .typst/template.typ

tmp_body=".tmp_report_body.typ"
pandoc report.md -o "$tmp_body"

cat > report.typ <<'EOF'
#import ".typst/template.typ": report

// 任意の追加import例
// #import "/assets/5-2/mpi_collective_tables.typ": collective_tables

// true: 先頭に目次を表示, false: 非表示
#let show_toc = true

#show: report.with(
	title: "高性能並行プログラミング (主専攻実験K-9) 進捗ログ",
	show-toc: show_toc,
)

EOF

cat "$tmp_body" >> report.typ
rm -f "$tmp_body"

echo "✅ Generated report.typ and .typst/template.typ"
"""
